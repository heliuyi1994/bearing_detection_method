[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-fault-diagnosis"
version = "0.1.0"
description = "Traditional signal processing toolkit for rolling bearing fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "nbclient>=0.9",
    "ipykernel>=6.25",
    "jupyter>=1.0",
]

[project.scripts]
bearing-fault = "bearing_fault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
