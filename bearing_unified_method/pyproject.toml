[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-unified"
version = "0.2.0"
description = "统一轴承故障诊断（v2 盲梳检规则）：glm 骨架 + kimi 门控的内生化合并——Kurtogram 选带 / 零相位解调 / 盲梳检存在性确认 / 频带落入定位"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bearing-unified contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bearing-unified = "bearing_unified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
